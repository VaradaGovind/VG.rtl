<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varada Govind Aakula | RTL and VLSI Portfolio</title>
    <meta name="description" content="Portfolio of Varada Govind Aakula, Electronics Engineer focused on RTL design, RISC-V architecture, CMOS VLSI, and edge-compatible hardware accelerators.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Sora', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: {
                        ink: '#04070D',
                        panel: '#0B1220',
                        panelSoft: '#111A2B',
                        mist: '#9AA8C0',
                        signal: '#22D3EE',
                        lime: '#A3E635',
                        ember: '#FB7185'
                    },
                    boxShadow: {
                        neon: '0 0 0 1px rgba(34,211,238,0.15), 0 12px 38px rgba(34,211,238,0.12)'
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            --cursor-size: 22px;
            --grid-size: 56px;
            --focus-ring: 0 0 0 2px rgba(163, 230, 53, 0.5);
        }

        html.lenis { height: auto; }

        body {
            background:
                radial-gradient(1200px 700px at 80% -10%, rgba(34,211,238,0.16), transparent 55%),
                radial-gradient(800px 500px at 10% 20%, rgba(163,230,53,0.08), transparent 55%),
                #04070D;
            color: #E6EDF7;
            overflow-x: hidden;
            cursor: none;
        }

        @media (pointer: coarse), (prefers-reduced-motion: reduce) {
            body { cursor: auto; }
        }

        .skip-link {
            position: absolute;
            left: 1rem;
            top: -200px;
            z-index: 10000;
            padding: 0.7rem 1rem;
            background: #A3E635;
            color: #081017;
            font-weight: 600;
            border-radius: 0.5rem;
            transition: top 0.2s ease;
        }

        .skip-link:focus { top: 1rem; }

        .noise-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 35;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .grid-bg {
            position: fixed;
            width: 220%;
            height: 220%;
            top: -60%;
            left: -60%;
            z-index: -2;
            pointer-events: none;
            background-size: var(--grid-size) var(--grid-size);
            background-image:
                linear-gradient(to right, rgba(34, 211, 238, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(34, 211, 238, 0.06) 1px, transparent 1px);
            transform: perspective(650px) rotateX(62deg);
            animation: gridMove 26s linear infinite;
            mask-image: radial-gradient(circle at center, black 28%, transparent 78%);
            -webkit-mask-image: radial-gradient(circle at center, black 28%, transparent 78%);
        }

        @keyframes gridMove {
            from { transform: perspective(650px) rotateX(62deg) translateY(0); }
            to { transform: perspective(650px) rotateX(62deg) translateY(56px); }
        }

        .cursor-dot {
            width: 8px;
            height: 8px;
            background: #E6EDF7;
            border-radius: 999px;
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
        }

        .cursor-outline {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(230, 237, 247, 0.35);
            border-radius: 999px;
            position: fixed;
            z-index: 9998;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        }

        @media (pointer: coarse), (prefers-reduced-motion: reduce) {
            .cursor-dot,
            .cursor-outline,
            .grid-bg,
            .noise-overlay {
                display: none;
            }
        }

        .glass-card {
            background: linear-gradient(140deg, rgba(17, 26, 43, 0.72), rgba(11, 18, 32, 0.65));
            border: 1px solid rgba(154, 168, 192, 0.16);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transform-style: preserve-3d;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .glass-card:hover,
        .glass-card:focus-within {
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 0 14px 46px rgba(3, 8, 19, 0.55);
        }

        .spotlight-wrapper {
            position: relative;
            overflow: hidden;
        }

        .spotlight-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: radial-gradient(520px circle at var(--mx, 50%) var(--my, 50%), rgba(34, 211, 238, 0.1), transparent 45%);
        }

        .spotlight-wrapper:hover::before,
        .spotlight-wrapper:focus-within::before {
            opacity: 1;
        }

        .metric-badge {
            border: 1px solid rgba(154, 168, 192, 0.2);
            background: rgba(11, 18, 32, 0.72);
        }

        .section-anchor {
            scroll-margin-top: 5.5rem;
        }

        .filter-btn[aria-pressed="true"] {
            border-color: rgba(163, 230, 53, 0.7);
            color: #D9F99D;
            background: rgba(163, 230, 53, 0.12);
        }

        a:focus-visible,
        button:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        .mobile-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .mobile-menu.open {
            max-height: 260px;
        }

        .text-stroke {
            -webkit-text-stroke: 1px #E6EDF7;
            color: transparent;
        }

        .hidden-card {
            display: none;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

    <div class="cursor-outline hidden md:block" aria-hidden="true"></div>
